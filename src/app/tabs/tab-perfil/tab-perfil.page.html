<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>
      Mi Perfil
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Mi Perfil</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-card>
    <ion-card-header class="ion-text-center">
      <ion-avatar class="profile-avatar">
        <img alt="Avatar" src="[https://placehold.co/200x200/FF007A/FFFFFF?text=USER](https://placehold.co/200x200/FF007A/FFFFFF?text=USER)" />
      </ion-avatar>
      <ion-card-title>@elfkamin</ion-card-title>
      <ion-card-subtitle>Aura Nivel 5</ion-card-subtitle>
    </ion-card-header>
  </ion-card>

  <ion-list [inset]="true">
    <ion-item [button]="true">
      <ion-icon slot="start" name="person-circle-outline"></ion-icon>
      <ion-label>Editar Perfil</ion-label>
    </ion-item>
    <ion-item [button]="true">
      <ion-icon slot="start" name="shield-checkmark-outline"></ion-icon>
      <ion-label>Mi "Ángel"</ion-label>
    </ion-item>
    <ion-item [button]="true">
      <ion-icon slot="start" name="wallet-outline"></ion-icon>
      <ion-label>Métodos de pago</ion-label>
    </ion-item>
  </ion-list>

  <ion-list [inset]="true">
    <ion-item [button]="true" color="danger" lines="none">
      <ion-icon slot="start" name="log-out-outline"></ion-icon>
      <ion-label>Cerrar Sesión</ion-label>
    </ion-item>
  </ion-list>

</ion-content>
