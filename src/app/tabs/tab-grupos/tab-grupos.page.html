<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>
      Mis Grupos
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Mis Grupos</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-list [inset]="true">
    <ion-item *ngFor="let grupo of grupos" [button]="true">
      <ion-icon slot="start" name="people" color="secondary"></ion-icon>
      <ion-label>
        <h2>{{ grupo.nombre }}</h2>
        <p>{{ grupo.miembros.join(', ') }}</p>
      </ion-label>
    </ion-item>
  </ion-list>

  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button (click)="crearGrupo()">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>

</ion-content>
